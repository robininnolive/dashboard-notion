<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Agenda</title>
<style>
  :root {
    --bg: #191919;
    --bg-hover: #232323;
    --card: #202020;
    --line: #2c2c2c;
    --ink: #e9e9e7;
    --muted: #8a8a86;
    --faint: #5c5c58;
    --accent: #9b8cff;
    --dot-meeting: #7fb8ff;
    --dot-ooo: #5c5c58;
    --dot-allday: #7fd8a8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 24px 14px;
    flex-shrink: 0;
  }
  .heading {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .heading .day {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-transform: capitalize;
  }
  .heading .rel {
    font-size: 12.5px;
    color: var(--muted);
  }
  .nav {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav button {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .nav button:hover {
    background: var(--bg-hover);
    color: var(--ink);
  }
  .nav .today {
    width: auto;
    padding: 0 12px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--line);
  }
  .list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 16px 24px;
  }
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--faint);
    font-size: 13.5px;
    gap: 6px;
    padding-bottom: 60px;
  }
  .event {
    display: flex;
    gap: 14px;
    padding: 12px 8px;
    border-radius: 8px;
    cursor: default;
    transition: background 0.12s ease;
  }
  .event:hover { background: var(--bg-hover); }
  .event + .event { border-top: 1px solid var(--line); }
  .event .time {
    width: 66px;
    flex-shrink: 0;
    padding-top: 1px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
    font-variant-numeric: tabular-nums;
  }
  .event .time .end {
    color: var(--faint);
  }
  .event .rail {
    width: 2px;
    border-radius: 2px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .event.meeting .rail { background: var(--dot-meeting); }
  .event.ooo .rail { background: var(--dot-ooo); }
  .event.allday .rail { background: var(--dot-allday); }
  .event .body {
    flex: 1;
    min-width: 0;
  }
  .event .title {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.4;
    word-break: break-word;
  }
  .event.ooo .title { color: var(--muted); font-weight: 400; }
  .event .meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 3px;
    font-size: 12px;
    color: var(--faint);
  }
  .event .meta a {
    color: var(--faint);
    text-decoration: none;
  }
  .event .meta a:hover { color: var(--accent); }
  .badge {
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--bg-hover);
    color: var(--muted);
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <div class="heading">
        <div class="day" id="dayLabel">—</div>
        <div class="rel" id="relLabel"></div>
      </div>
      <div class="nav">
        <button id="prevBtn" aria-label="Jour précédent">‹</button>
        <button id="todayBtn" class="today">Aujourd'hui</button>
        <button id="nextBtn" aria-label="Jour suivant">›</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </div>

<script>
// Données pré-chargées depuis Google Calendar (03 sept. – 05 oct. 2026)
const RAW_EVENTS = [
  {t:"Pas Robin", s:"2026-09-03T17:00:00+02:00", e:"2026-09-04T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Point Audiovisuel", s:"2026-09-04T11:30:00+02:00", e:"2026-09-04T12:00:00+02:00", type:"DEFAULT", url:"https://meet.google.com/epy-gvca-wqa"},
  {t:"Pas Robin", s:"2026-09-04T17:00:00+02:00", e:"2026-09-05T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Mariage Shirley", allDay:true, d:"2026-09-05", type:"DEFAULT"},
  {t:"Rattrapage", s:"2026-09-07T00:00:00+02:00", e:"2026-09-08T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Point Hebdo 360", s:"2026-09-07T11:00:00+02:00", e:"2026-09-07T11:30:00+02:00", type:"DEFAULT", url:"https://meet.google.com/jft-vqqx-phc"},
  {t:"Pas Robin", s:"2026-09-07T17:00:00+02:00", e:"2026-09-08T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-08T17:00:00+02:00", e:"2026-09-09T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Brief Innolive EVA Partners", s:"2026-09-09T16:00:00+02:00", e:"2026-09-09T16:30:00+02:00", type:"DEFAULT", url:"https://meet.google.com/xye-phhn-tkv"},
  {t:"Pas Robin", s:"2026-09-09T17:00:00+02:00", e:"2026-09-10T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-10T17:00:00+02:00", e:"2026-09-11T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-11T17:00:00+02:00", e:"2026-09-12T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-12T00:00:00+02:00", e:"2026-09-14T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Point Hebdo 360", s:"2026-09-14T10:00:00+02:00", e:"2026-09-14T10:30:00+02:00", type:"DEFAULT", url:"https://meet.google.com/jft-vqqx-phc"},
  {t:"Pas Robin", s:"2026-09-14T17:00:00+02:00", e:"2026-09-15T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-15T17:00:00+02:00", e:"2026-09-16T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-16T17:00:00+02:00", e:"2026-09-17T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-17T17:00:00+02:00", e:"2026-09-18T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-18T17:00:00+02:00", e:"2026-09-19T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-19T00:00:00+02:00", e:"2026-09-21T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Point Hebdo 360", s:"2026-09-21T11:00:00+02:00", e:"2026-09-21T11:30:00+02:00", type:"DEFAULT", url:"https://meet.google.com/jft-vqqx-phc"},
  {t:"Pas Robin", s:"2026-09-21T17:00:00+02:00", e:"2026-09-22T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-22T17:00:00+02:00", e:"2026-09-23T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-23T17:00:00+02:00", e:"2026-09-24T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-24T17:00:00+02:00", e:"2026-09-25T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-25T17:00:00+02:00", e:"2026-09-26T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-26T00:00:00+02:00", e:"2026-09-27T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-27T00:00:00+02:00", e:"2026-09-28T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Point Hebdo 360", s:"2026-09-28T11:00:00+02:00", e:"2026-09-28T11:30:00+02:00", type:"DEFAULT", url:"https://meet.google.com/jft-vqqx-phc"},
  {t:"Pas Robin", s:"2026-09-28T17:00:00+02:00", e:"2026-09-29T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-09-29T17:00:00+02:00", e:"2026-09-30T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"CM Rive de Gier", s:"2026-09-30T16:00:00+02:00", e:"2026-09-30T20:30:00+02:00", type:"DEFAULT", url:"https://meet.google.com/xqr-vvce-hpe"},
  {t:"Pas Robin", s:"2026-09-30T17:00:00+02:00", e:"2026-10-01T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-10-01T17:00:00+02:00", e:"2026-10-02T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-10-02T17:00:00+02:00", e:"2026-10-03T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-10-03T00:00:00+02:00", e:"2026-10-04T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Pas Robin", s:"2026-10-04T00:00:00+02:00", e:"2026-10-05T00:00:00+02:00", type:"OUT_OF_OFFICE"},
  {t:"Point COMM + Analyse", s:"2026-10-05T09:30:00+02:00", e:"2026-10-05T10:30:00+02:00", type:"DEFAULT", url:"https://meet.google.com/fkb-khrj-cfj"},
  {t:"Point Hebdo 360", s:"2026-10-05T11:00:00+02:00", e:"2026-10-05T11:30:00+02:00", type:"DEFAULT", url:"https://meet.google.com/jft-vqqx-phc"}
];

function ymd(date) {
  const y = date.getFullYear(), m = String(date.getMonth()+1).padStart(2,'0'), d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function hhmm(date) {
  return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

const events = RAW_EVENTS.map(ev => {
  if (ev.allDay) {
    return { title: ev.t, type: ev.type, allDay: true, dayKey: ev.d };
  }
  const start = new Date(ev.s);
  const end = new Date(ev.e);
  return {
    title: ev.t,
    type: ev.type,
    allDay: false,
    start, end,
    url: ev.url || null,
    dayKey: ymd(start),
    endsNextDay: ymd(start) !== ymd(end)
  };
});

let current = new Date(2026, 8, 10); // fallback, sera écrasé par "aujourd'hui" détecté côté client
const today = new Date();
current = new Date(today.getFullYear(), today.getMonth(), today.getDate());

const dayLabel = document.getElementById('dayLabel');
const relLabel = document.getElementById('relLabel');
const list = document.getElementById('list');

function relativeLabel(d) {
  const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const diff = Math.round((d - t) / 86400000);
  if (diff === 0) return "Aujourd'hui";
  if (diff === 1) return "Demain";
  if (diff === -1) return "Hier";
  if (diff > 1) return `Dans ${diff} jours`;
  return `Il y a ${Math.abs(diff)} jours`;
}

function render() {
  const key = ymd(current);
  dayLabel.textContent = current.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  relLabel.textContent = relativeLabel(current);

  const dayEvents = events
    .filter(ev => ev.dayKey === key)
    .sort((a, b) => {
      if (a.allDay) return -1;
      if (b.allDay) return 1;
      return a.start - b.start;
    });

  list.innerHTML = '';

  if (dayEvents.length === 0) {
    list.innerHTML = `<div class="empty">Rien de prévu ce jour-là</div>`;
    return;
  }

  for (const ev of dayEvents) {
    const row = document.createElement('div');
    const cls = ev.allDay ? 'allday' : (ev.type === 'OUT_OF_OFFICE' ? 'ooo' : 'meeting');
    row.className = `event ${cls}`;

    const timeHtml = ev.allDay
      ? `Journée`
      : `${hhmm(ev.start)}${ev.endsNextDay ? '' : `<br><span class="end">${hhmm(ev.end)}</span>`}`;

    const metaParts = [];
    if (ev.type === 'OUT_OF_OFFICE') metaParts.push(`<span class="badge">Absent</span>`);
    if (ev.url) metaParts.push(`<a href="${ev.url}" target="_blank" rel="noopener">Rejoindre</a>`);

    row.innerHTML = `
      <div class="time">${timeHtml}</div>
      <div class="rail"></div>
      <div class="body">
        <div class="title">${ev.title}</div>
        ${metaParts.length ? `<div class="meta">${metaParts.join('')}</div>` : ''}
      </div>
    `;
    list.appendChild(row);
  }
}

document.getElementById('prevBtn').addEventListener('click', () => {
  current.setDate(current.getDate() - 1);
  render();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  current.setDate(current.getDate() + 1);
  render();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  current = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  render();
});

render();
</script>
</body>
</html>
