<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Dashboard widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#18191b;
    --screen:#1f2023;
    --text-primary:#f2ede4;
    --text-dim:#8b8d92;
    --divider:rgba(255,255,255,0.08);
    --accent:#f2b134;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--charcoal);
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--text-primary);
  }
  .panel{
    display:flex;
    background:var(--charcoal);
    padding:28px 32px;
    gap:36px;
    align-items:stretch;
    min-height:100vh;
  }
  .col{
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .clock-col{
    flex:0 0 auto;
    padding-right:36px;
    border-right:1px solid var(--divider);
    justify-content:center;
  }
  .weather-col{
    flex:1 1 auto;
    min-width:0;
    justify-content:center;
  }
  .time{
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    font-size:72px;
    font-variant-numeric:tabular-nums;
    letter-spacing:0.5px;
  }
  .date-line{
    margin-top:6px;
    color:var(--text-dim);
    font-size:14px;
    text-transform:capitalize;
  }
  .weather-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .city-name{
    font-size:13px;
    color:var(--text-primary);
  }
  .city-input{
    background:transparent;
    border:none;
    border-bottom:1px solid var(--divider);
    color:var(--text-dim);
    padding:2px 0;
    font-size:12px;
    width:120px;
    outline:none;
  }
  .city-input::placeholder{
    color:var(--text-dim);
  }
  .city-input:focus{
    border-color:var(--accent);
  }
  .week-grid{
    display:grid;
    grid-template-columns:minmax(56px,auto) repeat(7, 1fr);
    row-gap:10px;
    column-gap:6px;
    align-items:center;
  }
  .week-grid .row-label{
    color:var(--text-dim);
    font-size:12px;
  }
  .week-grid .day-label{
    color:var(--text-dim);
    font-size:12px;
    text-align:center;
  }
  .week-grid .cell{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .week-grid .cell svg{
    width:30px;
    height:30px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .week-grid .cell span{
    font-size:14px;
    font-weight:600;
  }
  .status-msg{
    color:var(--text-dim);
    font-size:13px;
  }
</style>
</head>
<body>

<div class="panel">
  <div class="col clock-col">
    <div class="time" id="hms">00:00:00</div>
    <div class="date-line" id="date-line"></div>
  </div>

  <div class="col weather-col">
    <div class="weather-header">
      <span class="city-name" id="city-label">Saint-Chamond</span>
      <input class="city-input" id="city-input" type="text" placeholder="Chercher une ville" />
    </div>
    <div id="weather-body">
      <span class="status-msg">Chargement…</span>
    </div>
  </div>
</div>

<script>
  // Saint-Chamond, Loire, France (par défaut)
  let LAT = 45.4703;
  let LON = 4.5062;

  const DAY_LABELS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

  function pad(n){ return String(n).padStart(2,'0'); }

  function tickClock(){
    const now = new Date();
    document.getElementById('hms').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('date-line').textContent = now.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
  }
  setInterval(tickClock, 1000);
  tickClock();

  const ICONS = {
    sun: `<circle cx="12" cy="12" r="5" fill="currentColor" fill-opacity="0.2" stroke="currentColor"/><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.5" y1="4.5" x2="6.2" y2="6.2"/><line x1="17.8" y1="17.8" x2="19.5" y2="19.5"/><line x1="4.5" y1="19.5" x2="6.2" y2="17.8"/><line x1="17.8" y1="6.2" x2="19.5" y2="4.5"/>`,
    cloudsun: `<circle cx="8" cy="8" r="3.2" fill="currentColor" fill-opacity="0.2" stroke="currentColor"/><line x1="8" y1="2" x2="8" y2="3.6"/><line x1="2" y1="8" x2="3.6" y2="8"/><line x1="4" y1="4" x2="5.1" y2="5.1"/><path d="M6 20h11a4.2 4.2 0 0 0 .5-8.3 5.8 5.8 0 0 0-11.2 1.6A3.7 3.7 0 0 0 6 20z" fill="currentColor" fill-opacity="0.2" stroke="currentColor"/>`,
    cloud: `<path d="M6 18h11a4.2 4.2 0 0 0 .4-8.3 5.9 5.9 0 0 0-11.5 1.7A3.7 3.7 0 0 0 6 18z" fill="currentColor" fill-opacity="0.2" stroke="currentColor"/>`,
    fog: `<path d="M6 14h11a4.2 4.2 0 0 0 .3-8.3 5.9 5.9 0 0 0-11.4 1.6" fill="currentColor" fill-opacity="0.2" stroke="currentColor"/><line x1="3.5" y1="18" x2="20.5" y2="18"/><line x1="5.5" y1="21.5" x2="18.5" y2="21.5"/>`,
    rain: `<path d="M6 14h11a4.2 4.2 0 0 0 .3-8.3 5.9 5.9 0 0 0-11.4 1.6A3.6 3.6 0 0 0 6 14z" fill="currentColor" fill-opacity="0.2" stroke="currentColor"/><line x1="8" y1="17.5" x2="6.7" y2="21"/><line x1="12" y1="17.5" x2="10.7" y2="21"/><line x1="16" y1="17.5" x2="14.7" y2="21"/>`,
    snow: `<path d="M6 14h11a4.2 4.2 0 0 0 .3-8.3 5.9 5.9 0 0 0-11.4 1.6A3.6 3.6 0 0 0 6 14z" fill="currentColor" fill-opacity="0.2" stroke="currentColor"/><line x1="8" y1="17" x2="8" y2="22"/><line x1="6.2" y1="18.3" x2="9.8" y2="20.7"/><line x1="9.8" y1="18.3" x2="6.2" y2="20.7"/><line x1="16" y1="17" x2="16" y2="22"/><line x1="14.2" y1="18.3" x2="17.8" y2="20.7"/><line x1="17.8" y1="18.3" x2="14.2" y2="20.7"/>`,
    storm: `<path d="M6 13h11a4.2 4.2 0 0 0 .3-8.3 5.9 5.9 0 0 0-11.4 1.6A3.6 3.6 0 0 0 6 13z" fill="currentColor" fill-opacity="0.2" stroke="currentColor"/><polyline points="13,15 10,20 13.5,20 11,24.5" fill="none"/>`
  };

  const ICON_COLORS = {
    sun: '#f4c04c',
    cloudsun: '#f4c04c',
    cloud: '#b7bac2',
    fog: '#9aa0aa',
    rain: '#5fa8e0',
    snow: '#cfe3f5',
    storm: '#ff8a5c'
  };

  function weatherIcon(code){
    if(code === 0) return 'sun';
    if(code === 1 || code === 2) return 'cloudsun';
    if(code === 3) return 'cloud';
    if(code === 45 || code === 48) return 'fog';
    if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return 'rain';
    if([71,73,75,77,85,86].includes(code)) return 'snow';
    if([95,96,99].includes(code)) return 'storm';
    return 'cloud';
  }

  function svgIcon(key){
    const color = ICON_COLORS[key] || ICON_COLORS.cloud;
    return `<svg viewBox="0 0 24 24" style="color:${color}">${ICONS[key] || ICONS.cloud}</svg>`;
  }

  async function loadWeather(){
    const body = document.getElementById('weather-body');
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=temperature_2m,weather_code&timezone=auto&forecast_days=7`;
      const res = await fetch(url);
      const data = await res.json();

      let dayLabelsHtml = `<div class="row-label"></div>`;
      let morningHtml = `<div class="row-label">Matin</div>`;
      let afternoonHtml = `<div class="row-label">Après-midi</div>`;

      for(let d = 0; d < 7; d++){
        const morningIdx = d*24 + 9;
        const afternoonIdx = d*24 + 15;
        if(afternoonIdx >= data.hourly.time.length) break;

        const dateObj = new Date(data.hourly.time[d*24]);
        const weekday = DAY_LABELS[(dateObj.getDay()+6)%7];
        dayLabelsHtml += `<div class="day-label">${weekday}</div>`;

        const mTemp = Math.round(data.hourly.temperature_2m[morningIdx]);
        const mIcon = weatherIcon(data.hourly.weather_code[morningIdx]);
        morningHtml += `<div class="cell">${svgIcon(mIcon)}<span>${mTemp}°</span></div>`;

        const aTemp = Math.round(data.hourly.temperature_2m[afternoonIdx]);
        const aIcon = weatherIcon(data.hourly.weather_code[afternoonIdx]);
        afternoonHtml += `<div class="cell">${svgIcon(aIcon)}<span>${aTemp}°</span></div>`;
      }

      body.innerHTML = `<div class="week-grid">${dayLabelsHtml}${morningHtml}${afternoonHtml}</div>`;
    }catch(err){
      body.innerHTML = '<span class="status-msg">Météo indisponible pour le moment</span>';
    }
  }

  async function searchCity(name){
    const label = document.getElementById('city-label');
    label.textContent = 'Recherche…';
    try{
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=fr&format=json`;
      const res = await fetch(url);
      const data = await res.json();
      if(!data.results || data.results.length === 0){
        label.textContent = 'Ville introuvable';
        return;
      }
      const place = data.results[0];
      LAT = place.latitude;
      LON = place.longitude;
      label.textContent = place.name + (place.admin1 ? `, ${place.admin1}` : '');
      loadWeather();
    }catch(err){
      label.textContent = 'Recherche indisponible';
    }
  }

  document.getElementById('city-input').addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && e.target.value.trim()){
      searchCity(e.target.value.trim());
      e.target.value = '';
    }
  });

  loadWeather();
  setInterval(loadWeather, 30 * 60 * 1000);
</script>

</body>
</html>
